name: Pages

# The documentation (website/, Next.js with Fumadocs) at https://addstack.github.io/daw-ui/,
# with the playground (playground/, Vite) at /daw-ui/playground/.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "playground/**"
      - "website/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time; never cancel one that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
        env:
          PAGES_BASE_PATH: /daw-ui
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
      - id: deployment
        uses: actions/deploy-pages@v5
